@if (visible()) {
  <div class="install-banner" role="region" aria-label="Instalar aplicativo CityPenha">
    <img class="install-banner__icon" src="icons/icon-192.png" alt="" aria-hidden="true" width="48" height="48" />

    <div class="install-banner__body">
      <p class="install-banner__title">Instale o CityPenha</p>
      <p class="install-banner__text">Adicione o atalho na tela inicial e abra como um app.</p>
    </div>

    <div class="install-banner__actions">
      @if (canInstall()) {
        <button type="button" class="install-banner__btn install-banner__btn--primary" (click)="install()">
          Instalar
        </button>
      } @else {
        <button type="button" class="install-banner__btn install-banner__btn--primary" (click)="openSteps()">
          Como instalar
        </button>
      }
      <button type="button" class="install-banner__btn install-banner__btn--ghost" (click)="dismiss()" aria-label="Dispensar">
        Agora não
      </button>
    </div>
  </div>
}

@if (showSteps()) {
  <app-install-steps-sheet (closed)="closeSteps()" />
}
