<div class="home-skeleton" aria-busy="true" aria-label="A carregar o início">
  <div class="home-skeleton__app-header">
    <div class="home-skeleton__logo-slot home-skeleton--pulse"></div>
    <div class="home-skeleton__header-icons">
      <div class="home-skeleton__icon-chip home-skeleton--pulse"></div>
      <div class="home-skeleton__icon-chip home-skeleton--pulse"></div>
    </div>
  </div>

  <div class="home-skeleton__exp">
    <div class="home-skeleton__exp-left">
      <div class="home-skeleton__line home-skeleton__line--title home-skeleton--pulse"></div>
      <div class="home-skeleton__line home-skeleton__line--title home-skeleton__line--mid home-skeleton--pulse"></div>
      <div class="home-skeleton__line home-skeleton__line--muted home-skeleton--pulse"></div>
      <div class="home-skeleton__exp-row">
        <div class="home-skeleton__pill home-skeleton--pulse"></div>
        <div class="home-skeleton__xp home-skeleton--pulse"></div>
      </div>
    </div>
    <div class="home-skeleton__exp-right">
      <div class="home-skeleton__illu home-skeleton--pulse"></div>
      <div class="home-skeleton__dots">
        <span class="home-skeleton--pulse"></span>
        <span class="home-skeleton--pulse"></span>
        <span class="home-skeleton--pulse"></span>
        <span class="home-skeleton--pulse"></span>
      </div>
    </div>
  </div>

  <div class="home-skeleton__noticia-wrap">
    <div class="home-skeleton__noticia-card home-skeleton--pulse">
      <div class="home-skeleton__noticia-header">
        <span class="home-skeleton__dot home-skeleton--pulse"></span>
      </div>
      <div class="home-skeleton__noticia-body">
        <div class="home-skeleton__line home-skeleton__line--white home-skeleton--pulse"></div>
        <div class="home-skeleton__line home-skeleton__line--white home-skeleton__line--short home-skeleton--pulse"></div>
        <div class="home-skeleton__noticia-meta">
          <div class="home-skeleton__avatar home-skeleton--pulse"></div>
          <div class="home-skeleton__meta-col">
            <div class="home-skeleton__line home-skeleton__line--white-sm home-skeleton--pulse"></div>
            <div class="home-skeleton__line home-skeleton__line--white-xs home-skeleton--pulse"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="home-skeleton__tabs">
    <div class="home-skeleton__tab home-skeleton__tab--on home-skeleton--pulse"></div>
    <div class="home-skeleton__tab home-skeleton--pulse"></div>
    <div class="home-skeleton__tab home-skeleton--pulse"></div>
  </div>
  <div class="home-skeleton__list">
    @for (row of [1, 2]; track row) {
    <div class="home-skeleton__list-row">
      <div class="home-skeleton__thumb home-skeleton--pulse"></div>
      <div class="home-skeleton__list-text">
        <div class="home-skeleton__line home-skeleton--pulse"></div>
        <div class="home-skeleton__line home-skeleton__line--short home-skeleton--pulse"></div>
      </div>
    </div>
    }
  </div>
</div>
