<div class="forgot-container">
  <header class="top-bar">
    <button type="button" class="back-btn" (click)="goBack()" aria-label="Voltar">
      <img src="assets/back-dark.svg" alt="" width="24" height="24" />
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-shell" novalidate>
    <main class="content">
      <div class="form-wrapper">
        <h1 class="title">
          Redefinir<br />
          senha 🔑
        </h1>
        <p class="description">
          Insira o seu E-mail e enviaremos um link para a redefinição da sua senha
        </p>

        <label class="field">
          <span class="visually-hidden">E-mail</span>
          <span class="input-shell">
            <img class="input-icon" src="assets/email-icon-muted.svg" alt="" aria-hidden="true" />
            <input
              class="input-field"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="E-mail"
            />
          </span>
        </label>
        @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <p class="field-error">Informe seu e-mail.</p>
        } @else if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <p class="field-error">E-mail inválido.</p>
        }
      </div>
    </main>

    <footer class="form-footer">
      <button
        type="submit"
        class="btn-submit"
        [disabled]="submitting()"
        [attr.aria-busy]="submitting()"
      >
        @if (submitting()) {
        <mat-spinner diameter="22" />
        <span>Enviando…</span>
        } @else {
        <span>Enviar</span>
        }
      </button>
    </footer>
  </form>

  <app-legal-footer />
</div>
