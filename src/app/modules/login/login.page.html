<div class="login-container">

  <header class="top-bar">
    <button type="button" class="btn-skip" [disabled]="submitting()" (click)="onSkip();logout()">Pular</button>
  </header>

  <main class="content">

    <h1 class="title">
      Bem-vindo a sua<br>
      comunidade digital
    </h1>

    <div class="branding">
      <div class="logo-text">
        <img [src]="logoUrl" alt="City Penha Digital">
      </div>
    </div>

    <div class="actions">

      <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="onLogin('email')">
        <img src="assets/email-icon.svg" alt="" srcset="">
        <span>Continue com o E-mail</span>
      </button>

      <button type="button" class="btn btn-social" [disabled]="submitting()" [attr.aria-busy]="submitting()"
        (click)="googleLogin()">
        @if (submitting()) {
        <mat-spinner diameter="22" />
        } @else {
        <img src="assets/gmail-icon.svg" alt="" srcset="">
        }
        <span>{{ submitting() ? 'Entrando…' : 'Continue com Google' }}</span>
      </button>

      <button type="button" class="btn btn-social" [disabled]="submitting()" (click)="onLogin('apple')">
        <img src="assets/apple-icon.svg" alt="" srcset="">
        <span>Continue com a Apple</span>
      </button>

      <button type="button" class="btn btn-social" [disabled]="submitting()" (click)="onLogin('facebook')">
        <img src="assets/facebook-icon.svg" alt="" srcset="">
        <span>Continue com o Facebook</span>
      </button>

    </div>

    <div class="signup-link">
      Não tem conta? <a routerLink="/signup">cadastre-se</a>
    </div>

  </main>

  <footer class="legal-text">
    <p>
      Nós valorizamos a sua leitura, sua participação e a sua privacidade.
      Ao se cadastrar, você concorda com nossos
      <a routerLink="/termos-de-uso">Termos de Uso</a>
      e reconhece que nossa
      <a routerLink="/politica-de-privacidade">Política de Privacidade</a>
      se aplica a você.
    </p>
  </footer>

  <app-legal-footer />
</div>
