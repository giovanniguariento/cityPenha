<div class="not-found">
  <img class="not-found__logo" [src]="logoUrl" alt="CityPenha" width="160" height="48" />
  <p class="not-found__code" aria-hidden="true">404</p>
  <h1 class="not-found__title">Página não encontrada</h1>
  <p class="not-found__text">
    O link pode estar incorreto ou a página foi removida.
  </p>
  <a routerLink="/home" class="not-found__cta">Voltar ao início</a>
</div>
