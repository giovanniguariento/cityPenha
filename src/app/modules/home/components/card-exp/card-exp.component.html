<div
  class="container"
  role="link"
  tabindex="0"
  aria-label="Ver missões e começar"
  (click)="onMissionsActivate()"
  (keydown.enter)="onMissionsActivate()"
  (keydown.space)="onMissionsActivate($event)">
  <div class="left">
    <h1>Bem-vindo a sua comunidade CityPenha!</h1>
    <p>Explore quatro maneiras pelas quais você pode subir de nível.</p>
    <div class="exp-container">
      <span>Começar</span>
      <div class="exp">
        50XP
      </div>
    </div>
  </div>
  <div class="right">
    <img src="assets/progress-exp.png" alt="">
    <div>
      <span class="selected">1</span>
      <span>2</span>
      <span>3</span>
      <span>4</span>
    </div>
  </div>
</div>
