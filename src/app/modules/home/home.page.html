<app-header></app-header>
<main>
  <app-card-exp></app-card-exp>
  <swiper-container class="mySwiper" pagination="true" loop="true">
    @for (post of posts(); track trackByPostId($index, post)) {
    <swiper-slide>
      <app-card-noticia [post]="post"></app-card-noticia>
    </swiper-slide>
    }
  </swiper-container>
  <app-tabs [tabs]="tabs()"></app-tabs>
</main>
<app-nav></app-nav>
